[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bytes = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
terraria-protocol = { path = "crates/terraria-protocol" }
terraria-network = { path = "crates/terraria-network" }
tempfile = "3"
terraria-binary = { path = "crates/terraria-binary" }
terraria-world = { path = "crates/terraria-world" }
